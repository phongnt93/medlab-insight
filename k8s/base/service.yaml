apiVersion: v1
kind: Service
metadata:
  name: medlab-insight
  namespace: medlab
  labels:
    app.kubernetes.io/name: medlab-insight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: medlab-insight
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
