# Read-only access for the AI agent gateway. No write verbs anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-read
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-read
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: agent-gateway
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-read
  namespace: medlab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
      - endpoints
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-read
  namespace: medlab
subjects:
  - kind: ServiceAccount
    name: agent-gateway
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-read
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-read
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: agent-gateway
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-read
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-read
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-read
  namespace: jenkins
subjects:
  - kind: ServiceAccount
    name: agent-gateway
    namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-read
