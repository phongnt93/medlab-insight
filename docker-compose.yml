services:
  medlab-insight:
    build:
      context: .
      dockerfile: Dockerfile
    image: medlab-insight:local
    ports:
      - "8601:8501"
    env_file:
      - path: .env
        required: false
    environment:
      MEDLAB_LLM_MODE: auto
      MEDLAB_RISK_MODEL_PATH: /app/artifacts/risk_model.joblib
      MEDLAB_RISK_MODEL_META_PATH: /app/artifacts/model_card.json
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
