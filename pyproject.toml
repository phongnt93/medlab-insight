[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medlab-insight"
version = "0.1.0"
description = "MLOps demo: blood/urine lab analysis with a risk model and Gemini narrative"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "streamlit>=1.40,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "scikit-learn>=1.5,<1.8",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
train = ["mlflow>=2.16,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/medlab"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/medlab", "app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
