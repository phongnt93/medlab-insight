apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medlab-insight
  namespace: medlab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medlab-insight
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
