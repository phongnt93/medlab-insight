apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medlab-insight
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/phongnt93/medlab-insight.git
    targetRevision: HEAD
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: medlab
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
