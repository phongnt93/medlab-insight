apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medlab-insight
  namespace: medlab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: medlab-insight
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8501
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
