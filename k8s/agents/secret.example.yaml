# Create the real secret out-of-band, never commit it:
#   TOKEN=$(openssl rand -hex 32)
#   kubectl create secret generic agent-gateway-secret -n agents --from-literal=token="$TOKEN"
#   kubectl create secret generic agent-gateway-secret -n agents --from-literal=token="$TOKEN" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: agent-gateway-secret
  namespace: agents
type: Opaque
stringData:
  token: "replace-with-openssl-rand-hex-32"
