# Không commit secret thật. Tạo bằng lệnh:
# kubectl -n medlab create secret generic medlab-secrets \
#   --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# Nếu secret không tồn tại, Deployment vẫn chạy ở chế độ offline
# (secretRef.optional=true).
apiVersion: v1
kind: Secret
metadata:
  name: medlab-secrets
  namespace: medlab
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_ME"
